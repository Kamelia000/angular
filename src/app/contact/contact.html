
<section class="contact" id="contact">

  <div class="section-title">

    <p>LET'S CONNECT</p>

    <h2>Contact Me</h2>

  </div>

  <div class="contact-container">

    <p class="email">
      Email: {{ email }}
    </p>

    <form (ngSubmit)="sendMessage()">

      <input
        type="text"
        placeholder="Your Name"
        [(ngModel)]="userName"
        name="userName"
        required
      >

      <input
        type="email"
        placeholder="Your Email"
        [(ngModel)]="userEmail"
        name="userEmail"
        required
      >

      <textarea
        placeholder="Your Message"
        [(ngModel)]="message"
        name="message"
        required>
      </textarea>

      <button type="submit">
        Send Message
      </button>

    </form>

    @if (submitted) {

      <p class="success">
        Thank you! Your message has been received.
      </p>

    }

  </div>

</section>
